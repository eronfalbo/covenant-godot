name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

env:
  GODOT_VERSION: "4.6.1"

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Godot and export templates
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq wget unzip libfontconfig1

          # Download Godot headless
          wget -q https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable/Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip
          unzip -q Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip
          sudo mv Godot_v${GODOT_VERSION}-stable_linux.x86_64 /usr/local/bin/godot
          sudo chmod +x /usr/local/bin/godot

          # Download export templates
          wget -q https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable/Godot_v${GODOT_VERSION}-stable_export_templates.tpz
          mkdir -p ~/.local/share/godot/export_templates/${GODOT_VERSION}.stable
          unzip -q Godot_v${GODOT_VERSION}-stable_export_templates.tpz
          mv templates/* ~/.local/share/godot/export_templates/${GODOT_VERSION}.stable/

          # Verify
          ls ~/.local/share/godot/export_templates/${GODOT_VERSION}.stable/web_*

      - name: Import project
        run: godot --headless --import --quit 2>&1 || true

      - name: Export web build
        run: |
          mkdir -p build/web
          godot --headless --export-release "Web" build/web/index.html 2>&1

      - name: Add coi-serviceworker, cache-busting, and headers
        run: |
          cd build/web
          CACHE_BUST=$(echo $GITHUB_SHA | cut -c1-8)

          # Inline minimal coi-serviceworker — forces skip-waiting + cache-bust on update
          cat > coi-serviceworker.js << 'SWEOF'
          if(typeof window==='undefined'){self.addEventListener("install",()=>self.skipWaiting());self.addEventListener("activate",e=>e.waitUntil(self.clients.claim()));self.addEventListener("fetch",e=>{if(e.request.cache==="only-if-cached"&&e.request.mode!=="same-origin")return;e.respondWith(fetch(e.request).then(r=>{if(r.status===0)return r;const h=new Headers(r.headers);h.set("Cross-Origin-Embedder-Policy","require-corp");h.set("Cross-Origin-Opener-Policy","same-origin");return new Response(r.body,{status:r.status,statusText:r.statusText,headers:h})}).catch(x=>console.error(x)));})}else if(navigator.serviceWorker){navigator.serviceWorker.register(new URL("coi-serviceworker.js",document.currentScript.src).href).then(r=>{r.addEventListener("updatefound",()=>{r.installing?.addEventListener("statechange",()=>{if(r.installing?.state==="activated")window.location.reload()})})},console.error)}
          SWEOF

          # Add cache-busting query params to .pck and .wasm references in HTML and JS
          sed -i "s|index\.pck|index.pck?v=${CACHE_BUST}|g" index.html index.js 2>/dev/null || true
          sed -i "s|index\.wasm|index.wasm?v=${CACHE_BUST}|g" index.html index.js 2>/dev/null || true
          sed -i "s|index\.worker\.js|index.worker.js?v=${CACHE_BUST}|g" index.html index.js 2>/dev/null || true

          # No-cache headers + service worker script
          sed -i 's|<head>|<head>\n<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">\n<meta http-equiv="Pragma" content="no-cache">\n<meta http-equiv="Expires" content="0">\n<script src="coi-serviceworker.js"></script>|' index.html

      - uses: actions/upload-pages-artifact@v3
        with:
          path: build/web

  deploy:
    needs: export
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
